# ---------------------------------------------------------------------------
# Site-wide settings. Edit the values below to change the text that appears
# in the header, the browser tab and the footer of every page.
# ---------------------------------------------------------------------------

student_name:  Diego Romero
site_title:    Engineering & Research Portfolio
site_subtitle: Student Projects in Engineering, Technology, Experimental Science & Environmental Solutions
site_intro: >-
  I am a student from Lima, Peru, with a strong interest in chemistry, engineering, and technology.
  Through my academic projects, I have explored electrochemical reactions, the use of biochar for
  water treatment, robotics, and automation. These experiences have strengthened my interest in
  Chemical Engineering and encouraged me to explore how science and engineering can help solve
  practical problems.
site_strapline: Electrochemistry · Water Remediation with Biochar · Retail Robotics · Food-Service Automation

description: >-
  Engineering and research portfolio of Diego Romero, presenting student projects
  in retail robotics, food-service automation, experimental electrochemistry and
  environmental solutions.

footer_note: Portfolio pages prepared for university admissions reading. All research records are archived on Zenodo.

# --- Technical settings: change these only when moving the site ------------
title: Diego Romero — Engineering & Research Portfolio
url: "https://student-research-portfolios.github.io"
baseurl: "/diego-romero"

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

sass:
  style: compressed

exclude:
  - README.md
  - HANDOVER.md
